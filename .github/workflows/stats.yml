name: Update stat cards

on:
  schedule:
    # Every Monday at 05:00 UTC, an hour before the link check.
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_stats.py'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: update-stat-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render the cards, the JSON feed and the README breakdown
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats.py \
            --user ${{ github.repository_owner }} \
            --update-readme README.md \
            --update-readme README.pt-BR.md

      - name: Commit if anything changed
        run: |
          if [ -z "$(git status --porcelain assets README.md README.pt-BR.md)" ]; then
            echo "Cards unchanged."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md README.pt-BR.md
          git commit -m "Update GitHub stat cards"
          git push
