name: Check links

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - 'README.pt-BR.md'
      - '.github/workflows/links.yml'

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links in the profile READMEs
        uses: lycheeverse/lychee-action@v2
        with:
          # --no-progress keeps the log readable in CI.
          #
          # Exclusions, all of them hosts that fail for reasons unrelated to a
          # broken link:
          #   - instagram/x: block automated requests outright
          #   - github-readme-stats: the public instance is rate limited and
          #     answers 503 under load, which is an availability problem on
          #     their side, not a bad URL in this repo
          # Everything else must resolve, including the project links, the
          # personal site and the Credly credential.
          args: >-
            --no-progress
            --max-retries 3
            --exclude '^https?://(www\.)?(instagram\.com|x\.com|twitter\.com)'
            --exclude '^https?://github-readme-stats\.vercel\.app'
            README.md README.pt-BR.md
          fail: true
