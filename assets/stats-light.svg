    @keyframes fade-in { to { opacity: 1; } }
    @keyframes grow-in { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .grow { animation: none; opacity: 1; transform: none; }
    }
